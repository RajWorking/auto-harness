services:
  # Coding-agent loop. Under a profile so `docker compose up` starts only the service stack.
  # `docker compose run autoeval` still works.
  autoeval:
    profiles: ["loop"]
    build: .
    env_file: .env
    environment:
      - AGENT_MODEL=${AGENT_MODEL:-gpt-5.4}
      - TAU2_DATA_DIR=/tau2_data
    volumes:
      # Mount all editable files so changes take effect without rebuilding
      - ./agent:/app/agent
      - ./workspace:/app/workspace
      - ./experiment_config.yaml:/app/experiment_config.yaml
      - ./benchmark.py:/app/benchmark.py
      - ./gating.py:/app/gating.py
      - ./prepare.py:/app/prepare.py
      - ./record.py:/app/record.py
      # TAU2_DATA_DIR has two layers: the host-side substitution here controls which
      # directory is mounted; the container always sees it as /tau2_data (set above
      # in environment:). To use a different data directory, set TAU2_DATA_DIR in .env.
      - ${TAU2_DATA_DIR:-./tau2_data}:/tau2_data
    stdin_open: true
    tty: true

  # Agent optimization service (service/).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      retries: 15

  api:
    build:
      context: .
      target: service
    restart: unless-stopped
    environment:
      SERVICE_DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      SERVICE_AGENT_REPO: /data/agent_store/agent
    volumes:
      - ./agent_store:/data/agent_store
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Runs queued jobs. Needs E2B_API_KEY and the model API key in .env.
  worker:
    build:
      context: .
      target: service
    command: ["python", "-m", "service.worker"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_DATABASE_URL: postgresql+psycopg://harness:harness@postgres:5432/harness
      SERVICE_AGENT_REPO: /data/agent_store/agent
    volumes:
      - ./agent_store:/data/agent_store
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
